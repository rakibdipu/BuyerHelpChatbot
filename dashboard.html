<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuyerBot AI — Smart Shopping Assistant</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg1: #0f0c29;
      --bg2: #302b63;
      --bg3: #24243e;
      --accent: #6366f1;
      --accent2: #8b5cf6;
      --accent3: #06b6d4;
      --success: #10b981;
      --glass: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.12);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --card: rgba(255,255,255,0.08);
    }

    html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; }

    body {
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    /* Animated mesh background */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(99,102,241,0.18) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(139,92,246,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(6,182,212,0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    #root { height: 100vh; position: relative; z-index: 1; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    /* Keyframes */
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
      40% { transform: translateY(-7px); opacity: 1; }
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16,185,129,0.5); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16,185,129,0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16,185,129,0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 8px rgba(99,102,241,0.4); }
      50% { box-shadow: 0 0 20px rgba(99,102,241,0.8); }
    }

    .fade-up { animation: fadeUp 0.3s ease-out both; }
    .slide-in { animation: slideIn 0.3s ease-out both; }

    /* Glassmorphism card */
    .glass {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
    }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #818cf8, #c084fc, #22d3ee);
      background-size: 200% 200%;
      animation: gradientShift 4s ease infinite;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Input focus */
    .chat-input:focus {
      outline: none;
      border-color: rgba(99,102,241,0.7) !important;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.18), 0 0 12px rgba(99,102,241,0.2) !important;
    }

    /* Button hover states */
    .send-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(99,102,241,0.5) !important;
    }
    .quick-btn:hover:not(:disabled) {
      background: rgba(99,102,241,0.25) !important;
      border-color: rgba(99,102,241,0.6) !important;
      transform: translateY(-1px);
    }
    .action-chip:hover {
      background: rgba(99,102,241,0.3) !important;
      border-color: rgba(99,102,241,0.5) !important;
      transform: translateY(-1px);
    }
    .result-card:hover {
      border-color: rgba(99,102,241,0.4) !important;
      box-shadow: 0 4px 20px rgba(99,102,241,0.15) !important;
      transform: translateY(-2px);
    }
    .sidebar-item:hover {
      background: rgba(255,255,255,0.1) !important;
    }
    .sidebar-item.active {
      background: rgba(99,102,241,0.3) !important;
      border-left: 3px solid #818cf8 !important;
    }
    .reaction-btn:hover {
      background: rgba(255,255,255,0.15) !important;
      transform: scale(1.1);
    }
    .copy-btn:hover {
      background: rgba(255,255,255,0.15) !important;
    }
    .clear-btn:hover {
      background: rgba(239,68,68,0.2) !important;
      border-color: rgba(239,68,68,0.5) !important;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

/* ─────────────── DATA ─────────────── */
const CATEGORIES = [
  { icon: '💻', label: 'Electronics' },
  { icon: '👟', label: 'Fashion' },
  { icon: '🏠', label: 'Home & Garden' },
  { icon: '📱', label: 'Phones' },
  { icon: '🎮', label: 'Gaming' },
  { icon: '📚', label: 'Books' },
  { icon: '💄', label: 'Beauty' },
  { icon: '🚗', label: 'Auto' },
];

const QUICK_ACTIONS = [
  { label: '📦 Track Order',      text: 'How do I track my order?' },
  { label: '🔄 Return Policy',   text: 'What is the return policy?' },
  { label: '🚚 Shipping Info',   text: 'Shipping and delivery times' },
  { label: '💰 Best Deals',      text: 'Find best laptop deals' },
  { label: '💳 Payment Help',    text: 'My payment was declined' },
  { label: '🏷️ Coupons',        text: 'How to find discount coupons?' },
];

const SUGGESTIONS = {
  track:    ['Show carrier tracking sites', 'Amazon order tracking', 'Order not arrived yet?'],
  return:   ['Amazon return process', 'How to get a refund?', 'Free return shipping?'],
  shipping: ['Express delivery options', 'International shipping', 'Free shipping tips'],
  payment:  ['Safe payment methods', 'Dispute a charge', 'Buy now pay later options'],
  default:  ['Find best prices', 'Compare products', 'Read reviews'],
};

const BOT_KNOWLEDGE = [
  {
    match: t => /track|order|package|parcel|where.*my|shipped/i.test(t),
    key: 'track',
    response: `📦 **Order Tracking Guide**

**Step-by-step:**
1. Log into the retailer → "My Orders"
2. Click your order → view real-time status
3. Use the tracking number on the carrier's site directly

**Major carriers:**
• FedEx → fedex.com/tracking
• UPS → ups.com/track
• USPS → tools.usps.com
• DHL → dhl.com/tracking
• Shopee/Daraz → check app notifications

💡 **Pro tip:** Amazon users — open the app → "Your Orders" for live map tracking!`,
  },
  {
    match: t => /return|refund|exchange|send back|money back/i.test(t),
    key: 'return',
    response: `🔄 **Return & Refund Policies**

| Retailer | Window | Free Return? |
|----------|--------|-------------|
| Amazon | 30 days | ✅ Prime |
| Walmart | 30–90 days | ✅ In-store |
| Best Buy | 15 days | ✅ Members |
| Target | 90 days | ✅ RedCard |
| eBay | Per seller | ⚠️ Varies |

📌 **Tips to make returns smooth:**
• Keep original packaging
• Photograph item before returning
• Request prepaid return label`,
  },
  {
    match: t => /ship|deliver|arrive|how long|dispatch/i.test(t),
    key: 'shipping',
    response: `🚚 **Shipping & Delivery**

**Estimated delivery times:**
⚡ Same-day — select cities (Amazon, Walmart)
🚀 Overnight — next business day
📦 Expedited — 2–3 business days
📬 Standard — 5–7 business days
🌏 International — 7–30 days

**Free shipping options:**
• Amazon Prime (\$139/yr) — FREE 1–2 day
• Walmart+ (\$98/yr) — FREE shipping
• Orders over \$25–35 on most sites

💡 Track shipments in real-time with your tracking number!`,
  },
  {
    match: t => /pay|credit|debit|declined|charge|billing|invoice/i.test(t),
    key: 'payment',
    response: `💳 **Payment Help Center**

**Common issues:**
🚫 **Declined card** — verify billing address matches bank; try incognito mode
💸 **Double charge** — wait 24–48h (usually a hold); dispute if not resolved
⚠️ **Unauthorized charge** — call bank immediately → report to retailer

**Safest payment methods (ranked):**
1. 🥇 Credit card (best fraud protection)
2. 🥈 PayPal (buyer protection)
3. 🥉 Buy Now Pay Later (Klarna, Afterpay)
4. ❌ Wire transfer / gift cards — AVOID for unknown sellers

🔒 Always look for HTTPS 🔒 before entering payment info!`,
  },
  {
    match: t => /coupon|discount|promo|deal|sale|voucher|code/i.test(t),
    key: 'default',
    response: `🏷️ **Finding Best Deals & Coupons**

**Browser extensions (install these!):**
• 🍯 **Honey** — auto-applies coupon codes at checkout
• 💰 **Rakuten** — 1–40% cashback at 3500+ stores
• 🔔 **Capital One Shopping** — compares prices instantly

**Deal tracking sites:**
• 🐪 **CamelCamelCamel** — Amazon price history & alerts
• ⚡ **Slickdeals** — community-curated deals
• 🛒 **RetailMeNot** — coupon codes for 100K+ stores

💡 **Secret tips:**
- Abandon your cart overnight (retailers often send 10–20% off)
- Sign up for newsletters = welcome discount
- Check if student/military discounts apply!`,
  },
  {
    match: t => /hello|hi|hey|help|start|helo|hii|good|morning|evening|night/i.test(t),
    key: 'default',
    response: `👋 Hey there! Welcome to **BuyerBot AI** 🛒

I'm your intelligent shopping assistant powered by smart response engine.

**Here's what I can do:**
• 🔍 Product search with real web results
• 📦 Order tracking guidance
• 🔄 Return & refund policy lookup
• 🚚 Shipping time estimations
• 💳 Payment troubleshooting
• 🏷️ Finding best deals & coupons
• ⭐ Product recommendations

Ask me anything about your shopping! What can I help you with?`,
  },
  {
    match: t => /compar|vs|better|difference|which|recommend/i.test(t),
    key: 'default',
    response: `⚖️ **Product Comparison Guide**

When comparing products, look at:

**Key factors to evaluate:**
1. 💰 Price vs. value — not just cheapest, but best value
2. ⭐ Rating — aim for 4.2+ with 100+ reviews
3. 🔧 Warranty & support — 1-2 years preferred
4. 📦 Return policy — generous return window = lower risk
5. 🚚 Shipping speed — does seller offer Prime/fast delivery?

**Best comparison tools:**
• Google Shopping — side-by-side specs & prices
• RTINGS.com — for electronics (TVs, audio)
• GSMArena — for smartphones
• Notebookcheck — for laptops
• Wirecutter (NYT) — expert picks across categories

💡 Tip: Search "[product] Reddit" for honest community reviews!`,
  },
];

/* ─────────────── WEB SEARCH SIM ─────────────── */
const searchWeb = async (query, setIsSearching) => {
  setIsSearching(true);
  await new Promise(r => setTimeout(r, 1600));
  const enc = encodeURIComponent(query);
  const lower = query.toLowerCase();
  const results = [];

  if (/laptop|notebook|macbook|chromebook/i.test(lower)) {
    results.push(
      { title: 'Best Laptops 2025 – TechRadar', snippet: 'Top-rated laptops for work, gaming, students & creators. Expert-tested deals updated weekly.', url: 'https://www.techradar.com/best/best-laptops', source: 'TechRadar', rating: '4.8' },
      { title: `${query} – Price Comparison`, snippet: `Compare prices for "${query}" across Amazon, Best Buy, Newegg, and Costco. Find the lowest price with fast shipping.`, url: `https://shopping.google.com/search?q=${enc}`, source: 'Google Shopping', rating: null },
      { title: 'Laptop Deals & Reviews – NotebookCheck', snippet: 'In-depth laptop reviews with benchmarks and real-world tests. Find the best laptop for every budget.', url: 'https://www.notebookcheck.net', source: 'NotebookCheck', rating: '4.7' }
    );
  } else if (/phone|iphone|samsung|pixel|oneplus|xiaomi/i.test(lower)) {
    results.push(
      { title: 'Best Smartphones 2025 – CNET', snippet: 'Expert picks for the best phones of the year. Updated reviews with camera tests and battery life comparisons.', url: 'https://www.cnet.com/tech/mobile/best-smartphones/', source: 'CNET', rating: '4.9' },
      { title: `${query} – Specs & Prices`, snippet: `Full specifications, pricing history, and user reviews for ${query}. Compare with similar devices.`, url: `https://www.gsmarena.com/search.php3?sQuickSearch=${enc}`, source: 'GSMArena', rating: '4.6' }
    );
  } else if (/headphone|earbuds|airpods|speaker|audio/i.test(lower)) {
    results.push(
      { title: 'Best Headphones 2025 – RTINGS.com', snippet: 'Objective measurements and expert reviews for headphones, earbuds, and speakers. Data-driven recommendations.', url: 'https://www.rtings.com/headphones', source: 'RTINGS.com', rating: '4.9' },
      { title: `${query} – Audio Deals`, snippet: `Current prices and deals for ${query} from Amazon, B&H Photo, and specialty audio stores.`, url: `https://shopping.google.com/search?q=${enc}`, source: 'Google Shopping', rating: null }
    );
  } else if (/tv|television|monitor|display/i.test(lower)) {
    results.push(
      { title: 'Best TVs 2025 – RTINGS.com', snippet: 'Comprehensive TV reviews with HDR, gaming, and picture quality tests. The most trusted TV review site.', url: 'https://www.rtings.com/tv', source: 'RTINGS.com', rating: '4.9' },
      { title: `${query} – TV Deals`, snippet: `Compare ${query} prices across retailers. Find the best deal with warranty and return policy info.`, url: `https://shopping.google.com/search?q=${enc}`, source: 'Google Shopping', rating: null }
    );
  } else if (/price|buy|deal|cheap|cost|afford/i.test(lower)) {
    results.push(
      { title: `Best Price for "${query}"`, snippet: 'Real-time price comparison. Find the lowest current price including shipping across all major retailers.', url: `https://www.google.com/search?q=${enc}+best+price`, source: 'Google', rating: null },
      { title: 'Price History – CamelCamelCamel', snippet: `Track price history for ${query} on Amazon. See the all-time low and get price drop alerts via email.`, url: `https://camelcamelcamel.com/search?sq=${enc}`, source: 'CamelCamelCamel', rating: '4.7' }
    );
  } else {
    results.push(
      { title: `"${query}" – Search Results`, snippet: `Find the best prices, reviews, and information about ${query}. Curated results from trusted sources.`, url: `https://www.google.com/search?q=${enc}`, source: 'Google', rating: null },
      { title: `${query} – Wirecutter Picks`, snippet: `Expert recommendations for ${query}. Tested and reviewed by professional editors at NYT Wirecutter.`, url: `https://www.nytimes.com/wirecutter/search/?q=${enc}`, source: 'Wirecutter', rating: '4.8' }
    );
  }

  setIsSearching(false);
  return results;
};

/* ─────────────── GENERATE RESPONSE ─────────────── */
const generateResponse = async (text, setIsSearching) => {
  for (const entry of BOT_KNOWLEDGE) {
    if (entry.match(text)) {
      await new Promise(r => setTimeout(r, 700));
      return { text: entry.response, results: [], suggKey: entry.key };
    }
  }
  const results = await searchWeb(text, setIsSearching);
  return {
    text: results.length > 0
      ? `🔍 Here's what I found for **"${text}"**:`
      : `I couldn't find specific info. Try asking about products, prices, shipping, or returns!`,
    results,
    suggKey: 'default',
  };
};

/* ─────────────── COMPONENTS ─────────────── */

const StarRating = ({ rating }) => {
  if (!rating) return null;
  const stars = Math.round(parseFloat(rating) / 1);
  return (
    <span style={{ color: '#f59e0b', fontSize: '0.75rem', fontWeight: 600 }}>
      ★ {rating}
    </span>
  );
};

const SearchResultCard = ({ result, idx }) => (
  <div className="result-card glass fade-up" style={{
    borderRadius: '14px', padding: '14px 16px',
    border: '1px solid rgba(255,255,255,0.12)',
    transition: 'all 0.25s ease',
    animationDelay: `${idx * 0.08}s`,
    cursor: 'pointer',
  }}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '10px', marginBottom: '8px' }}>
      <h3 style={{ fontSize: '0.9rem', fontWeight: 600, margin: 0, flex: 1, lineHeight: 1.4 }}>
        <a href={result.url} target="_blank" rel="noopener noreferrer"
          style={{ color: '#818cf8', textDecoration: 'none' }}>
          {result.title}
        </a>
      </h3>
      <div style={{ display: 'flex', alignItems: 'center', gap: '6px', flexShrink: 0 }}>
        <StarRating rating={result.rating} />
        <span style={{
          fontSize: '0.65rem', color: '#94a3b8',
          background: 'rgba(255,255,255,0.08)',
          padding: '2px 8px', borderRadius: '6px',
          border: '1px solid rgba(255,255,255,0.1)',
          fontWeight: 500, whiteSpace: 'nowrap'
        }}>{result.source}</span>
      </div>
    </div>
    <p style={{ fontSize: '0.8375rem', color: '#94a3b8', lineHeight: 1.6, margin: '0 0 10px' }}>
      {result.snippet}
    </p>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
      <span style={{ fontSize: '0.7rem', color: '#6b7280' }}>🔗 Web Result</span>
      <a href={result.url} target="_blank" rel="noopener noreferrer"
        style={{
          fontSize: '0.75rem', color: '#818cf8', textDecoration: 'none',
          padding: '4px 12px',
          background: 'rgba(99,102,241,0.15)',
          borderRadius: '7px', fontWeight: 600,
          border: '1px solid rgba(99,102,241,0.3)',
          transition: 'all 0.2s'
        }}>
        Visit →
      </a>
    </div>
  </div>
);

const TypingDot = ({ delay = '0s' }) => (
  <div style={{
    width: '8px', height: '8px',
    background: 'linear-gradient(135deg, #818cf8, #c084fc)',
    borderRadius: '50%',
    animation: 'bounce 1.4s infinite ease-in-out',
    animationDelay: delay, animationFillMode: 'both'
  }} />
);

const SuggestionChips = ({ suggKey, onSelect }) => {
  const chips = SUGGESTIONS[suggKey] || SUGGESTIONS.default;
  return (
    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '7px', marginTop: '10px', marginLeft: '46px' }}>
      {chips.map((c, i) => (
        <button key={i} className="action-chip" onClick={() => onSelect(c)}
          style={{
            fontSize: '0.75rem', padding: '5px 12px',
            background: 'rgba(99,102,241,0.15)',
            border: '1px solid rgba(99,102,241,0.3)',
            borderRadius: '9999px', color: '#a5b4fc',
            cursor: 'pointer', fontWeight: 500,
            transition: 'all 0.2s', fontFamily: 'Inter, sans-serif',
            animationDelay: `${i * 0.07}s`
          }}>
          {c}
        </button>
      ))}
    </div>
  );
};

const MessageBubble = ({ msg, onReact, onCopy, onSuggest }) => {
  const isUser = msg.sender === 'user';
  const [copied, setCopied] = useState(false);
  const [reacted, setReacted] = useState(null);

  const handleCopy = () => {
    navigator.clipboard?.writeText(msg.text).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  };

  const handleReact = (r) => {
    setReacted(r);
    onReact?.(msg.id, r);
  };

  return (
    <div className="fade-up" style={{ animationDelay: '0s' }}>
      <div style={{
        display: 'flex', gap: '10px',
        justifyContent: isUser ? 'flex-end' : 'flex-start',
        alignItems: 'flex-start'
      }}>
        {!isUser && (
          <div style={{
            width: '38px', height: '38px', borderRadius: '12px', flexShrink: 0,
            background: 'linear-gradient(135deg, #6366f1, #8b5cf6)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontSize: '1.2rem', boxShadow: '0 4px 15px rgba(99,102,241,0.4)'
          }}>🤖</div>
        )}

        <div style={{ maxWidth: '75%' }}>
          <div style={{
            padding: '12px 16px', borderRadius: '16px',
            ...(isUser ? {
              background: 'linear-gradient(135deg, #6366f1, #8b5cf6)',
              borderBottomRightRadius: '4px',
              boxShadow: '0 4px 15px rgba(99,102,241,0.35)'
            } : {
              background: 'rgba(255,255,255,0.07)',
              border: '1px solid rgba(255,255,255,0.12)',
              borderBottomLeftRadius: '4px',
              backdropFilter: 'blur(10px)'
            })
          }}>
            <div style={{
              fontSize: '0.875rem', lineHeight: 1.7,
              whiteSpace: 'pre-wrap', wordBreak: 'break-word',
              color: isUser ? 'white' : '#e2e8f0'
            }}>
              {msg.text}
            </div>
            <div style={{
              fontSize: '0.65rem', marginTop: '6px',
              color: isUser ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.35)',
              display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '8px'
            }}>
              <span>{msg.time}</span>
              {!isUser && (
                <div style={{ display: 'flex', gap: '5px', alignItems: 'center' }}>
                  <button className="copy-btn" onClick={handleCopy} title="Copy"
                    style={{ background: 'none', border: 'none', cursor: 'pointer', color: copied ? '#34d399' : '#64748b', fontSize: '0.7rem', padding: '2px 6px', borderRadius: '5px', transition: 'all 0.2s', fontFamily: 'Inter, sans-serif' }}>
                    {copied ? '✓ Copied' : '⎘ Copy'}
                  </button>
                  <button className="reaction-btn" onClick={() => handleReact('👍')}
                    title="Helpful"
                    style={{ background: reacted === '👍' ? 'rgba(52,211,153,0.2)' : 'none', border: 'none', cursor: 'pointer', fontSize: '0.75rem', padding: '2px 5px', borderRadius: '5px', transition: 'all 0.2s' }}>
                    👍
                  </button>
                  <button className="reaction-btn" onClick={() => handleReact('👎')}
                    title="Not helpful"
                    style={{ background: reacted === '👎' ? 'rgba(248,113,113,0.2)' : 'none', border: 'none', cursor: 'pointer', fontSize: '0.75rem', padding: '2px 5px', borderRadius: '5px', transition: 'all 0.2s' }}>
                    👎
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>

        {isUser && (
          <div style={{
            width: '38px', height: '38px', borderRadius: '12px', flexShrink: 0,
            background: 'linear-gradient(135deg, #0891b2, #0284c7)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontSize: '1.1rem', boxShadow: '0 4px 15px rgba(6,182,212,0.3)'
          }}>👤</div>
        )}
      </div>

      {/* Search results */}
      {!isUser && msg.results && msg.results.length > 0 && (
        <div style={{ marginLeft: '48px', marginTop: '10px', display: 'flex', flexDirection: 'column', gap: '10px' }}>
          {msg.results.map((r, i) => <SearchResultCard key={i} result={r} idx={i} />)}
        </div>
      )}

      {/* Suggestion chips */}
      {!isUser && msg.suggKey && (
        <SuggestionChips suggKey={msg.suggKey} onSelect={onSuggest} />
      )}
    </div>
  );
};

/* ─────────────── SIDEBAR ─────────────── */
const Sidebar = ({ activeCategory, setActiveCategory, stats, onClearChat }) => (
  <div className="glass" style={{
    width: '230px', flexShrink: 0, display: 'flex', flexDirection: 'column',
    borderRight: '1px solid rgba(255,255,255,0.08)', padding: '20px 0',
    height: '100%', overflowY: 'auto'
  }}>
    {/* Logo */}
    <div style={{ padding: '0 18px 20px', borderBottom: '1px solid rgba(255,255,255,0.08)' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '6px' }}>
        <div style={{
          width: '36px', height: '36px', borderRadius: '10px',
          background: 'linear-gradient(135deg, #6366f1, #8b5cf6)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: '1.2rem', animation: 'float 3s ease-in-out infinite'
        }}>🛒</div>
        <div>
          <div style={{ fontSize: '1.1rem', fontWeight: 800 }} className="gradient-text">BuyerBot</div>
          <div style={{ fontSize: '0.65rem', color: '#64748b', fontWeight: 500 }}>AI Shopping Assistant</div>
        </div>
      </div>
      {/* Online indicator */}
      <div style={{
        display: 'flex', alignItems: 'center', gap: '7px',
        background: 'rgba(16,185,129,0.1)', border: '1px solid rgba(16,185,129,0.2)',
        borderRadius: '8px', padding: '5px 10px', fontSize: '0.72rem', fontWeight: 600, color: '#34d399'
      }}>
        <span style={{ width: '7px', height: '7px', background: '#10b981', borderRadius: '50%', animation: 'pulse-ring 2s infinite' }} />
        Online • AI Ready
      </div>
    </div>

    {/* Stats */}
    <div style={{ padding: '14px 18px', borderBottom: '1px solid rgba(255,255,255,0.08)' }}>
      <div style={{ fontSize: '0.7rem', color: '#475569', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: '10px' }}>Session Stats</div>
      <div style={{ display: 'flex', gap: '8px' }}>
        {[
          { val: stats.messages, label: 'Messages' },
          { val: stats.searches, label: 'Searches' },
        ].map(s => (
          <div key={s.label} style={{
            flex: 1, background: 'rgba(255,255,255,0.05)', borderRadius: '10px',
            padding: '8px', textAlign: 'center', border: '1px solid rgba(255,255,255,0.08)'
          }}>
            <div style={{ fontSize: '1.25rem', fontWeight: 700, color: '#818cf8' }}>{s.val}</div>
            <div style={{ fontSize: '0.6rem', color: '#64748b' }}>{s.label}</div>
          </div>
        ))}
      </div>
    </div>

    {/* Categories */}
    <div style={{ padding: '14px 18px', flex: 1 }}>
      <div style={{ fontSize: '0.7rem', color: '#475569', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: '10px' }}>Shop Categories</div>
      {CATEGORIES.map(cat => (
        <button key={cat.label} className={`sidebar-item ${activeCategory === cat.label ? 'active' : ''}`}
          onClick={() => setActiveCategory(cat.label === activeCategory ? null : cat.label)}
          style={{
            width: '100%', display: 'flex', alignItems: 'center', gap: '10px',
            padding: '8px 10px', borderRadius: '9px',
            background: 'transparent', border: 'none',
            color: activeCategory === cat.label ? '#a5b4fc' : '#94a3b8',
            cursor: 'pointer', fontSize: '0.8375rem', fontWeight: 500,
            transition: 'all 0.2s', textAlign: 'left',
            fontFamily: 'Inter, sans-serif', marginBottom: '2px',
            borderLeft: activeCategory === cat.label ? '3px solid #818cf8' : '3px solid transparent',
          }}>
          <span style={{ fontSize: '1rem' }}>{cat.icon}</span>
          {cat.label}
        </button>
      ))}
    </div>

    {/* Clear Chat */}
    <div style={{ padding: '14px 18px', borderTop: '1px solid rgba(255,255,255,0.08)' }}>
      <button className="clear-btn" onClick={onClearChat}
        style={{
          width: '100%', padding: '9px',
          background: 'rgba(239,68,68,0.1)',
          border: '1px solid rgba(239,68,68,0.25)',
          borderRadius: '10px', color: '#f87171',
          cursor: 'pointer', fontSize: '0.8rem', fontWeight: 600,
          transition: 'all 0.2s', fontFamily: 'Inter, sans-serif',
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '7px'
        }}>
        🗑️ Clear Chat
      </button>
      <div style={{ textAlign: 'center', fontSize: '0.65rem', color: '#334155', marginTop: '10px' }}>
        BuyerBot v2.0 • Made with ❤️
      </div>
    </div>
  </div>
);

/* ─────────────── MAIN APP ─────────────── */
const App = () => {
  const initMsg = {
    id: 1, sender: 'bot', results: [], suggKey: 'default',
    text: `👋 Welcome to **BuyerBot AI** — your smart shopping companion!

I'm here to help you shop smarter. Ask me about:
• 🔍 Products, prices & comparisons
• 📦 Order tracking
• 🔄 Return & refund policies
• 🚚 Shipping & delivery
• 💳 Payment help
• 🏷️ Coupons & deals

Type a message or click a Quick Action below ↓`,
    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  };

  const [messages, setMessages] = useState([initMsg]);
  const [input, setInput] = useState('');
  const [isTyping, setIsTyping] = useState(false);
  const [isSearching, setIsSearching] = useState(false);
  const [activeCategory, setActiveCategory] = useState(null);
  const [stats, setStats] = useState({ messages: 0, searches: 0 });
  const bottomRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages, isTyping, isSearching]);

  // When category selected, auto-send a search query
  useEffect(() => {
    if (activeCategory) {
      sendMessage(`Show me best ${activeCategory} products and deals`);
    }
  }, [activeCategory]);

  const sendMessage = useCallback(async (textOverride) => {
    const text = (textOverride || input).trim();
    if (!text || isTyping || isSearching) return;
    setInput('');
    inputRef.current?.focus();

    const userMsg = {
      id: Date.now(), sender: 'user', results: [], suggKey: null,
      text,
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    };
    setMessages(prev => [...prev, userMsg]);
    setStats(s => ({ ...s, messages: s.messages + 1 }));
    setIsTyping(true);

    setTimeout(async () => {
      const resp = await generateResponse(text, (v) => {
        setIsSearching(v);
        if (v) setStats(s => ({ ...s, searches: s.searches + 1 }));
      });
      setIsTyping(false);
      setMessages(prev => [...prev, {
        id: Date.now() + 1, sender: 'bot',
        text: resp.text, results: resp.results, suggKey: resp.suggKey,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      }]);
    }, 400);
  }, [input, isTyping, isSearching]);

  const handleKey = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  };

  const handleClearChat = () => {
    setMessages([initMsg]);
    setStats({ messages: 0, searches: 0 });
    setActiveCategory(null);
  };

  const busy = isTyping || isSearching;

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden' }}>
      {/* Sidebar */}
      <Sidebar
        activeCategory={activeCategory}
        setActiveCategory={setActiveCategory}
        stats={stats}
        onClearChat={handleClearChat}
      />

      {/* Main Chat */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

        {/* Top bar */}
        <div className="glass" style={{
          padding: '12px 20px', borderBottom: '1px solid rgba(255,255,255,0.08)',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
            <div style={{
              width: '10px', height: '10px', background: '#10b981', borderRadius: '50%',
              animation: 'pulse-ring 2s infinite'
            }} />
            <span style={{ fontWeight: 600, fontSize: '0.9rem', color: '#e2e8f0' }}>
              Buyer Help Assistant
            </span>
            <span style={{
              fontSize: '0.65rem', padding: '2px 8px',
              background: 'rgba(99,102,241,0.2)',
              border: '1px solid rgba(99,102,241,0.3)',
              borderRadius: '9999px', color: '#a5b4fc', fontWeight: 500
            }}>AI Powered</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
            <span style={{ fontSize: '0.7rem', color: '#475569' }}>{messages.length} messages</span>
          </div>
        </div>

        {/* Quick Actions Bar */}
        <div className="glass" style={{
          padding: '10px 16px', borderBottom: '1px solid rgba(255,255,255,0.06)',
          display: 'flex', gap: '8px', flexWrap: 'wrap', flexShrink: 0
        }}>
          {QUICK_ACTIONS.map((a, i) => (
            <button key={i} className="quick-btn" onClick={() => sendMessage(a.text)} disabled={busy}
              style={{
                padding: '5px 12px',
                background: 'rgba(255,255,255,0.05)',
                border: '1px solid rgba(255,255,255,0.1)',
                borderRadius: '9999px', fontSize: '0.77rem',
                color: '#94a3b8', cursor: busy ? 'not-allowed' : 'pointer',
                fontWeight: 500, transition: 'all 0.2s', opacity: busy ? 0.5 : 1,
                fontFamily: 'Inter, sans-serif'
              }}>
              {a.label}
            </button>
          ))}
        </div>

        {/* Messages */}
        <div style={{
          flex: 1, overflowY: 'auto', padding: '20px',
          display: 'flex', flexDirection: 'column', gap: '16px'
        }}>
          {messages.map(m => (
            <MessageBubble key={m.id} msg={m} onSuggest={(t) => sendMessage(t)} />
          ))}

          {/* Typing indicator */}
          {isTyping && (
            <div className="fade-up" style={{ display: 'flex', gap: '10px', alignItems: 'flex-start' }}>
              <div style={{
                width: '38px', height: '38px', borderRadius: '12px',
                background: 'linear-gradient(135deg, #6366f1, #8b5cf6)',
                display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.2rem',
                boxShadow: '0 4px 15px rgba(99,102,241,0.4)', animation: 'glow 2s ease-in-out infinite'
              }}>🤖</div>
              <div style={{
                background: 'rgba(255,255,255,0.07)', border: '1px solid rgba(255,255,255,0.12)',
                borderRadius: '16px', borderBottomLeftRadius: '4px', padding: '14px 18px',
                backdropFilter: 'blur(10px)'
              }}>
                <div style={{ display: 'flex', gap: '6px', alignItems: 'center' }}>
                  <TypingDot delay="0s" />
                  <TypingDot delay="0.2s" />
                  <TypingDot delay="0.4s" />
                </div>
              </div>
            </div>
          )}

          {/* Searching indicator */}
          {isSearching && (
            <div className="fade-up" style={{ display: 'flex', gap: '10px', alignItems: 'flex-start' }}>
              <div style={{
                width: '38px', height: '38px', borderRadius: '12px',
                background: 'linear-gradient(135deg, #0891b2, #06b6d4)',
                display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.2rem',
                boxShadow: '0 4px 15px rgba(6,182,212,0.4)'
              }}>🔍</div>
              <div style={{
                background: 'rgba(255,255,255,0.07)', border: '1px solid rgba(255,255,255,0.12)',
                borderRadius: '16px', borderBottomLeftRadius: '4px', padding: '12px 18px',
                backdropFilter: 'blur(10px)', display: 'flex', alignItems: 'center', gap: '10px'
              }}>
                <div style={{
                  background: 'linear-gradient(90deg, rgba(99,102,241,0) 0%, rgba(99,102,241,0.5) 50%, rgba(99,102,241,0) 100%)',
                  backgroundSize: '200% 100%',
                  animation: 'shimmer 1.5s infinite',
                  height: '2px', width: '80px', borderRadius: '2px'
                }} />
                <span style={{ fontSize: '0.8rem', color: '#67e8f9', fontStyle: 'italic', fontWeight: 500 }}>
                  Searching the web…
                </span>
              </div>
            </div>
          )}

          <div ref={bottomRef} />
        </div>

        {/* Input Area */}
        <div className="glass" style={{
          padding: '14px 20px', borderTop: '1px solid rgba(255,255,255,0.08)', flexShrink: 0
        }}>
          <div style={{ display: 'flex', gap: '10px', alignItems: 'center' }}>
            <div style={{ position: 'relative', flex: 1 }}>
              <input
                ref={inputRef}
                type="text"
                className="chat-input"
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={handleKey}
                placeholder="Ask me anything about shopping…"
                disabled={busy}
                style={{
                  width: '100%',
                  padding: '12px 18px',
                  background: 'rgba(255,255,255,0.06)',
                  border: '1.5px solid rgba(255,255,255,0.12)',
                  borderRadius: '12px',
                  fontSize: '0.9rem',
                  color: '#e2e8f0',
                  transition: 'all 0.25s',
                  fontFamily: 'Inter, sans-serif',
                  backdropFilter: 'blur(10px)',
                  opacity: busy ? 0.7 : 1
                }}
              />
            </div>
            <button
              className="send-btn"
              onClick={() => sendMessage()}
              disabled={!input.trim() || busy}
              style={{
                padding: '12px 22px', flexShrink: 0,
                background: (!input.trim() || busy)
                  ? 'rgba(99,102,241,0.3)'
                  : 'linear-gradient(135deg, #6366f1, #8b5cf6)',
                border: 'none', borderRadius: '12px',
                color: 'white', fontSize: '0.9rem', fontWeight: 700,
                cursor: (!input.trim() || busy) ? 'not-allowed' : 'pointer',
                transition: 'all 0.25s', whiteSpace: 'nowrap',
                fontFamily: 'Inter, sans-serif',
                boxShadow: (!input.trim() || busy) ? 'none' : '0 4px 15px rgba(99,102,241,0.4)'
              }}>
              Send ➤
            </button>
          </div>
          <div style={{ textAlign: 'center', fontSize: '0.65rem', color: '#334155', marginTop: '8px' }}>
            Press Enter to send &nbsp;•&nbsp; BuyerBot AI v2.0 &nbsp;•&nbsp; Powered by Smart Response Engine
          </div>
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
